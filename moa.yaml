    - moa-code
    starts:
    - step: integrate-investigation
      when: investigation_result
    - step: integrate-investigation
      when: tool_continuation
    - step: integrate-investigation
      when: opencode_maintenance
    - step: integrate-investigation
      when: delegated_investigation
    - step: request-filter
      when: always
    output:
      step: investigation-check
      passthrough_input_on_no_tool_calls: true
    steps:
    - id: request-filter
