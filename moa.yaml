        family: Mitos
      provider: lms
      model: Qwen/Qwen3-Coder-Next-FP8
      role: mitos complete council
      family: Mitos
      conversation: advisory
      activation: single
      max_tokens: 2560
      reasoning_reserve: 0
      temperature: 0.4
      keep_alive: -1
      num_ctx: 8192
      response_schema: council-response
      repair:
        prompt: council-repair
        attempts: 1
      tools:
        mode: none
        include: []
        exclude: []
      targets:
      - step: contributions
        when: always
    - id: deepseek-council
