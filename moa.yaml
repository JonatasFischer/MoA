  direct:
    aliases:
    - claude-direct-code
    - direct-code
    starts:
    - step: answer
      when: always
    output:
      step: answer
      passthrough_input_on_no_tool_calls: false
    steps:
    - id: answer
      type: ai
      prompt_variables: {}
      provider: lms
      model: Qwen/Qwen3-Coder-Next-FP8
      role: general
      conversation: full
      activation: single
      reasoning_reserve: 0
      think: false
      keep_alive: 10m
      num_ctx: 131072
      tools:
        mode: client
        include: []
        exclude: []
        validator: client-tools
      targets:
      - step: $return
        when: always
