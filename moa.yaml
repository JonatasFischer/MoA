      prompt: council-contributor
      prompt_variables:
        family: fable
      provider: lms
      model: Qwen/Qwen3-Coder-Next-FP8
      role: fable complete council
      family: fable
      conversation: advisory
      activation: single
      max_tokens: 2560
      reasoning_reserve: 0
      temperature: 0.2
      keep_alive: -1
      num_ctx: 8192
