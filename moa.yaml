        include: []
        exclude: []
      targets:
      - step: contributions
        when: always
    - id: contributions
      type: gate
      min_success: 2
      max_concurrency: 3
      deadline_seconds: 45.0
      completion: all-or-deadline
      on_failure: fail
      targets:
      - step: aggregate
        when: always
    - id: aggregate
      type: ai
      prompt: council-aggregator
      prompt_variables: {}
      provider: lms
      model: Qwen/Qwen3-Coder-Next-FP8
      role: authoritative council aggregator
      family: qwen
      conversation: full
      activation: single
      max_tokens: request
      reasoning_reserve: 4096
      temperature: 0.2
      think: true
      tools:
        mode: client
        include: []
        exclude:
        - task
        validator: client-tools
      retry:
        attempts: 1
        condition: empty
        max_tokens_multiplier: 2.0
        think: false
      fallback:
        gate: contributions
        strategy: best-nonempty
      targets:
      - step: $return
        when: has_tool_calls
