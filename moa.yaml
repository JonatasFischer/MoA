server:
  host: 127.0.0.1
  port: 14598
  api_key_env: MOA_API_KEY
  trace_log_path: moa-trace.jsonl
  trace_max_bytes: 33554432
  trace_backup_count: 3
  warmup_on_startup: true
  warmup_profiles:
  - code
  pid_file: .moa.pid
  tool_enforcement:
    enabled: true
    required_tools:
    - task
    enforcement_mode: auto
    min_investigation_calls: 1
providers:
  ollama:
    type: ollama
    base_url: http://127.0.0.1:11434
    timeout_seconds: 1800.0
  deepseek:
    type: deepseek
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    timeout_seconds: 1800.0
  lms:
    type: openai-compatible
    base_url: https://llm.internal.dev.riss.space/openai
    api_key_env: LMS_KEY
    timeout_seconds: 1800.0
profiles:
  direct:
    aliases:
    - claude-direct-code
    - direct-code
    strategy: direct
    provider: ollama
    model: qwen3-coder:30b-128k
    proposers: []
    contributors: []
    tool_policy: final-only
    min_quorum: 1
    max_concurrency: 2
    proposer_max_tokens: 1024
    contributor_max_tokens: 1536
    reference_token_budget: 8000
    reasoning_reserve: {}
    contributor_history_chars: 12000
    contributor_format: text
    keep_alive: 10m
    num_ctx: 131072
    think: false
  code:
    aliases:
    - claude-moa-code
    - moa-code
    strategy: council
    proposers: []
    contributors:
    - provider: lms
      model: Qwen/Qwen3-Coder-Next-FP8
      role: qwen complete council
      family: qwen
      temperature: 0.3
      keep_alive: -1
      num_ctx: 8192
    - provider: lms
      model: Qwen/Qwen3-Coder-Next-FP8
      role: gemma complete council
      family: gemma
      temperature: 0.4
      keep_alive: -1
      num_ctx: 8192
    - provider: lms
      model: Qwen/Qwen3-Coder-Next-FP8
      role: deepseek complete council
      family: deepseek
      temperature: 0.2
      keep_alive: -1
      num_ctx: 8192
    aggregator:
      provider: lms
      model: Qwen/Qwen3-Coder-Next-FP8
      role: authoritative council aggregator
      family: qwen
      temperature: 0.2
      think: true
    tool_dispatch:
      provider: lms
      model: Qwen/Qwen3-Coder-Next-FP8
      role: direct tool dispatcher
      family: qwen
      temperature: 0.1
    tool_policy: final-only
    min_quorum: 2
    max_concurrency: 3
    contributor_deadline_seconds: 45.0
    proposer_max_tokens: 1024
    contributor_max_tokens: 2560
    reference_token_budget: 6000
    reasoning_reserve:
      qwen: 4096
    contributor_history_chars: 12000
    contributor_format: json-schema
  council-k2:
    aliases:
    - benchmark-council-k2
    strategy: classic
    proposers:
    - provider: ollama
      model: qwen2.5-coder:7b
      role: independent implementer
      temperature: 0.2
      keep_alive: -1
      num_ctx: 8192
    - provider: ollama
      model: gemma4:latest
      role: independent reviewer
      temperature: 0.2
      keep_alive: -1
      num_ctx: 8192
    contributors: []
    aggregator:
      provider: lms
      model: Qwen/Qwen3-Coder-Next-FP8
      role: benchmark synthesizer
      family: qwen
      temperature: 0.1
    tool_policy: final-only
    min_quorum: 2
    max_concurrency: 1
    proposer_max_tokens: 1024
    contributor_max_tokens: 1536
    reference_token_budget: 6000
    reasoning_reserve:
      qwen: 4096
    contributor_history_chars: 12000
    contributor_format: text
  council-k3:
    aliases:
    - benchmark-council-k3
    strategy: classic
    proposers:
    - provider: ollama
      model: qwen2.5-coder:7b
      role: independent implementer
      temperature: 0.2
      keep_alive: -1
      num_ctx: 8192
    - provider: ollama
      model: gemma4:latest
      role: independent reviewer
      temperature: 0.2
      keep_alive: -1
      num_ctx: 8192
    - provider: ollama
      model: deepseek-coder-v2:16b
      role: independent edge-case analyst
      temperature: 0.2
      keep_alive: 0
      num_ctx: 8192
    contributors: []
    aggregator:
      provider: lms
      model: Qwen/Qwen3-Coder-Next-FP8
      role: benchmark synthesizer
      family: qwen
      temperature: 0.1
    tool_policy: final-only
    min_quorum: 3
    max_concurrency: 1
    proposer_max_tokens: 1024
    contributor_max_tokens: 1536
    reference_token_budget: 6000
    reasoning_reserve:
      qwen: 4096
    contributor_history_chars: 12000
    contributor_format: text
  self-consistency:
    aliases:
    - benchmark-self-consistency
    strategy: classic
    proposers:
    - provider: ollama
      model: qwen2.5-coder:7b
      role: independent sample one
      temperature: 0.5
      keep_alive: -1
      num_ctx: 8192
    - provider: ollama
      model: qwen2.5-coder:7b
      role: independent sample two
      temperature: 0.7
      keep_alive: -1
      num_ctx: 8192
    - provider: ollama
      model: qwen2.5-coder:7b
      role: independent sample three
      temperature: 0.9
      keep_alive: -1
      num_ctx: 8192
    contributors: []
    aggregator:
      provider: lms
      model: Qwen/Qwen3-Coder-Next-FP8
      role: self-consistency synthesizer
      family: qwen
      temperature: 0.1
    tool_policy: final-only
    min_quorum: 3
    max_concurrency: 1
    proposer_max_tokens: 1024
    contributor_max_tokens: 1536
    reference_token_budget: 6000
    reasoning_reserve:
      qwen: 4096
    contributor_history_chars: 12000
    contributor_format: text
  deepseek-direct:
    aliases:
    - deepseek-direct-code
    strategy: direct
    provider: deepseek
    model: deepseek-chat
    proposers: []
    contributors: []
    tool_policy: final-only
    min_quorum: 1
    max_concurrency: 2
    proposer_max_tokens: 1024
    contributor_max_tokens: 1536
    reference_token_budget: 8000
    reasoning_reserve: {}
    contributor_history_chars: 12000
    contributor_format: text
default_profile: code
